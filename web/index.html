<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EduQuest - Rural Learning App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eduquest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EduQuest - Rural Learning</title>
  <link rel="manifest" href="manifest.json">

  <!-- EduQuest High-Precision Hindi & English Web Speech Synthesis Engine -->
  <script>
    window.eduquestTts = {
      findBestVoice: function(isHindi) {
        var voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;
        
        if (isHindi) {
          // Priority 1: Google Hindi or Microsoft Hindi (Kalpana / Hemant)
          for (var i = 0; i < voices.length; i++) {
            var v = voices[i];
            var name = (v.name || '').toLowerCase();
            if (name.includes('google हिन्दी') || name.includes('google hindi') || name.includes('kalpana') || name.includes('hemant')) {
              return v;
            }
          }
          // Priority 2: Any voice with hi-IN or hi or Hindi name
          for (var j = 0; j < voices.length; j++) {
            var v2 = voices[j];
            var lang2 = (v2.lang || '').toLowerCase();
            var name2 = (v2.name || '').toLowerCase();
            if (lang2.startsWith('hi') || name2.includes('hindi') || name2.includes('हिन्दी')) {
              return v2;
            }
          }
          // Priority 3: Any India locale voice
          for (var k = 0; k < voices.length; k++) {
            var v3 = voices[k];
            var lang3 = (v3.lang || '').toLowerCase();
            if (lang3.includes('-in') || lang3.includes('_in')) {
              return v3;
            }
          }
        } else {
          // English natural voices
          for (var e = 0; e < voices.length; e++) {
            var ve = voices[e];
            var nameE = (ve.name || '').toLowerCase();
            var langE = (ve.lang || '').toLowerCase();
            if (langE.startsWith('en') && (nameE.includes('natural') || nameE.includes('google') || nameE.includes('jenny') || nameE.includes('guy') || nameE.includes('samantha'))) {
              return ve;
            }
          }
        }
        return null;
      },
      speak: function(text, locale, onEnd, onError) {
        try {
          window.speechSynthesis.cancel();
          if (!text || text.trim().length === 0) return;

          var isHindi = (locale === 'hi' || (locale && locale.startsWith('hi')));
          var utt = new SpeechSynthesisUtterance(text);
          utt.lang = isHindi ? 'hi-IN' : 'en-US';
          utt.rate = isHindi ? 0.85 : 0.95;
          utt.pitch = 1.0;
          utt.volume = 1.0;

          var voice = this.findBestVoice(isHindi);
          if (voice) {
            utt.voice = voice;
            console.log('[EduQuest TTS] Selected voice:', voice.name, voice.lang);
          }

          utt.onend = function() {
            if (typeof onEnd === 'function') onEnd();
          };
          utt.onerror = function(err) {
            console.warn('[EduQuest TTS] error:', err);
            if (typeof onError === 'function') onError(err);
          };

          window.speechSynthesis.speak(utt);
        } catch (e) {
          console.error('[EduQuest TTS] Exception:', e);
        }
      },
      stop: function() {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
    };

    // Pre-warm voices on load
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
      };
      window.speechSynthesis.getVoices();
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
